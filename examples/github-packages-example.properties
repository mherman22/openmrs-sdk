# Example OpenMRS Distro Properties with GitHub Packages Configuration
# This file demonstrates how to configure GitHub Packages for downloading artifacts

# Basic distro information
name=example-distro-with-github-packages
version=1.0.0
war.openmrs=2.5.0

# GitHub Packages Configuration
# Replace these values with your actual GitHub Packages repository details
github.packages.url=https://maven.pkg.github.com/YOUR_ORG/YOUR_REPO
github.packages.username=YOUR_GITHUB_USERNAME
github.packages.token=YOUR_GITHUB_TOKEN

# Example modules from GitHub Packages
# These modules will be downloaded from the configured GitHub Packages repository
omod.example-module=1.0.0
omod.example-module.groupId=com.example
omod.example-module.type=jar

# Example OWA from GitHub Packages
owa.example-owa=1.0.0
owa.example-owa.groupId=com.example
owa.example-owa.type=zip

# Example content package from GitHub Packages
content.example-content=1.0.0
content.example-content.groupId=com.example
content.example-content.type=zip

# Standard OpenMRS modules (will be downloaded from default repositories)
omod.reporting=1.30.0
omod.reportingrest=1.3.0
omod.webservices.rest=2.42.0

# Platform WAR
war.openmrs=2.5.0 